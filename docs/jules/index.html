<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>Page protégée</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,800&family=Nunito:wght@600;800&display=swap" rel="stylesheet" />
<style>
  :root { --ink:#2a2118; --paper:#fff6e8; --panel:#fffdf8; --mustard:#f0b429; --teal:#2a9d8f; --coral:#e76f51; --sky:#4cc9f0; --mint:#b7e4c7; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: Nunito, "Segoe UI", sans-serif; color: var(--ink); background:
    radial-gradient(circle at 12% 0%, #ffe7a3 0, transparent 28%),
    radial-gradient(circle at 92% 4%, #c8f4ee 0, transparent 24%), var(--paper); }
  h1,h2 { font-family: Fraunces, Georgia, serif; margin: 0; }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 28px 16px 64px; display:flex; flex-direction:column; gap: 16px; }
  .card { background: var(--panel); border: 4px solid var(--ink); border-radius: 24px; box-shadow: 6px 6px 0 var(--ink); overflow: hidden; }
  .pad { padding: 16px 18px 18px; }
  .gate { min-height: 100vh; display:grid; place-items:center; padding: 24px; }
  .gate form { width: min(440px, 100%); padding: 24px; }
  label { display:block; font-weight: 800; margin-top: 16px; }
  input { width:100%; margin-top: 8px; border: 4px solid var(--ink); border-radius: 16px; padding: 12px 14px; font: inherit; background: var(--paper); }
  button { font: inherit; font-weight: 800; cursor: pointer; }
  .go { margin-top: 16px; width:100%; border: 4px solid var(--ink); border-radius: 16px; background: var(--mustard); padding: 12px; }
  .err { color: var(--coral); font-weight: 800; }
  .hero { display:grid; gap: 16px; align-items:center; padding: 16px; }
  @media (min-width: 720px) { .hero { grid-template-columns: 150px 1fr; } .grid3 { grid-template-columns: 1fr 1fr 1fr; } .split { grid-template-columns: 1.2fr .8fr; } }
  .grid3, .split, .two { display:grid; gap: 16px; }
  @media (min-width: 860px) { .two { grid-template-columns: 1fr 1fr; } }
  img.shot { width:100%; height: 176px; object-fit: cover; object-position: top; display:block; background: var(--paper); }
  img.tall { height: 210px; }
  img.contain { object-fit: contain; }
  .portrait { width: 128px; height: 168px; object-fit: cover; object-position: top; border: 4px solid var(--ink); border-radius: 18px; }
  .kicker { color: var(--teal); font-size: 12px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; }
  .speech { display:inline-block; margin-top: 10px; background:#fff; border: 3px solid var(--ink); border-radius: 18px 18px 18px 4px; padding: 8px 12px; font-weight: 700; }
  .people { display:grid; gap: 10px; }
  @media (min-width: 640px) { .people { grid-template-columns: 1fr 1fr; } }
  .who { border: 4px dashed var(--ink); border-radius: 16px; background: var(--paper); padding: 10px 12px; }
  .quest { width:100%; display:flex; gap: 12px; align-items:center; text-align:left; border: 4px solid var(--ink); border-radius: 16px; background: var(--paper); padding: 10px; margin-top: 10px; }
  .n { width: 48px; height: 48px; flex: none; display:grid; place-items:center; border-radius: 999px; border: 4px solid var(--ink); font-family: Fraunces, Georgia, serif; font-size: 20px; }
  .done { text-decoration: line-through; opacity: .6; }
  ul { margin: 8px 0 0; padding-left: 18px; }
  .lock { width: 56px; height: 56px; border-radius: 999px; border: 4px solid var(--ink); background: var(--mustard); display:grid; place-items:center; font-weight: 800; }
</style>
</head>
<body>
<div id="app" class="gate">
  <form class="card gate-form" id="form">
    <div class="lock" aria-hidden="true">clé</div>
    <h1>Page protégée</h1>
    <p>Ce dossier est réservé. Entre le mot de passe pour l'ouvrir.</p>
    <label for="pw">Mot de passe</label>
    <input id="pw" type="password" autocomplete="current-password" required />
    <p class="err" id="err" hidden>Mot de passe incorrect.</p>
    <button class="go" type="submit">Ouvrir</button>
  </form>
</div>

const b64 = (s) => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function unlock(password) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey(
    { name:"PBKDF2", salt: b64(VAULT.salt), iterations: VAULT.iter, hash:"SHA-256" },
    base, { name:"AES-GCM", length:256 }, false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({ name:"AES-GCM", iv: b64(VAULT.iv) }, key, b64(VAULT.data));
  return JSON.parse(new TextDecoder().decode(plain));
}
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&','<':'<','>':'>','"':'"'}[c])); }
function render(pack) {
  const tones = ["#f0b429","#4cc9f0","#b7e4c7","#e76f51"];
  const saved = JSON.parse(localStorage.getItem("jules-quests") || "{}");
  const app = document.getElementById("app");
  app.className = "";
  document.title = pack.title;
  app.innerHTML = `
  <div class="wrap">
    <header class="card hero">
      <img class="portrait" alt="" src="${IMGS.jules}" />
      <div>
        <p class="kicker">${esc(pack.kicker)}</p>
        <h1 style="font-size:42px;line-height:1">${esc(pack.title)}</h1>
        <p class="speech">${esc(pack.speech)}</p>
        <p>${esc(pack.intro)}</p>
      </div>
    </header>
    <section class="grid3">
      ${pack.beats.map(b => `<article class="card"><img class="shot" alt="${esc(b.alt)}" src="${IMGS[b.img]}" /><div class="pad"><h2>${esc(b.n)}. ${esc(b.title)}</h2><p>${esc(b.text)}</p></div></article>`).join("")}
    </section>
    <section class="split">
      <article class="card pad">
        <h2>Qui appeler cette vague</h2>
        <div class="people">${pack.contacts.map(c => `<div class="who"><strong>${esc(c.name)}</strong><p>${esc(c.note)}</p></div>`).join("")}</div>
      </article>
      <article class="card">
        <img class="shot tall" alt="" src="${IMGS.stop}" />
        <div class="pad"><h2>${esc(pack.stopTitle)}</h2><p class="err">${esc(pack.stopNames)}</p><p>${esc(pack.stopNote)}</p></div>
      </article>
    </section>
    <article class="card">
      <img class="shot tall contain" alt="" src="${IMGS.pillars}" />
      <div class="pad"><h2>Les 4 piliers</h2><p>${esc(pack.pillars)}</p></div>
    </article>
    <section class="two">
      <article class="card">
        <img class="shot" alt="" src="${IMGS.tools}" />
        <div class="pad"><h2>Dans les mains</h2><ul>${pack.tools.map(t => `<li>${esc(t)}</li>`).join("")}</ul></div>
      </article>
      <article class="card pad">
        <h2>Quêtes <span id="count"></span></h2>
        <div id="quests"></div>
      </article>
    </section>
    <p style="text-align:center">${esc(pack.footer)}</p>
  </div>`;
  const box = document.getElementById("quests");
  function paint() {
    const done = JSON.parse(localStorage.getItem("jules-quests") || "{}");
    const n = pack.quests.filter(q => done[q.id]).length;
    document.getElementById("count").textContent = n + "/" + pack.quests.length;
    box.innerHTML = pack.quests.map((q,i) => `<button class="quest" data-id="${esc(q.id)}" type="button"><span class="n" style="background:${done[q.id] ? "#b7e4c7" : tones[i]};color:${i===3 && !done[q.id] ? "#fffdf8" : "#2a2118"}">${done[q.id] ? "ok" : i+1}</span><span><small>${esc(q.title)}</small><br><span class="${done[q.id] ? "done" : ""}">${esc(q.text)}</span></span></button>`).join("");
    box.querySelectorAll("button").forEach(btn => btn.onclick = () => {
      const id = btn.getAttribute("data-id");
      const cur = JSON.parse(localStorage.getItem("jules-quests") || "{}");
      cur[id] = !cur[id];
      localStorage.setItem("jules-quests", JSON.stringify(cur));
      paint();
    });
  }
  paint();
}
document.getElementById("form").onsubmit = async (e) => {
  e.preventDefault();
  const pw = document.getElementById("pw").value;
  const btn = e.target.querySelector("button");
  btn.disabled = true; btn.textContent = "Vérification…";
  try {
    const pack = await unlock(pw);
    sessionStorage.setItem("jules-gate", pw);
    render(pack);
  } catch (err) {
    document.getElementById("err").hidden = false;
    btn.disabled = false; btn.textContent = "Ouvrir";
  }
};
const saved = sessionStorage.getItem("jules-gate");
if (saved) unlock(saved).then(render).catch(() => sessionStorage.removeItem("jules-gate"));
</script>
